name: Release

# Publishes to the VS Code Marketplace when you push a version tag, e.g.:
#   git tag v1.2.0 && git push origin v1.2.0
#
# One-time setup: add your Azure DevOps Personal Access Token (Marketplace >
# Manage scope) as a repository secret named VSCE_PAT:
#   gh secret set VSCE_PAT
# Without it, the workflow still builds the .vsix and attaches it to a GitHub
# Release, but skips the Marketplace publish. Add the secret and re-run the
# workflow to publish; re-running is safe.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # allows the job to create the GitHub Release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG. Bump the version, commit, then tag."
            exit 1
          fi

      - name: Type-check
        run: npm run compile

      - name: Package VSIX
        run: npm run package

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT secret is not set; skipping the Marketplace publish. Upload the .vsix from the GitHub Release manually, or add the secret and re-run this workflow."
            exit 0
          fi
          npx --yes @vscode/vsce publish --no-dependencies --packagePath ./*.vsix -p "$VSCE_PAT"

      - name: Create GitHub Release with the .vsix attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.vsix --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./*.vsix --title "$GITHUB_REF_NAME" --generate-notes
          fi
