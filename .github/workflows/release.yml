name: Release

# Publishes to the VS Code Marketplace when you push a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
#
# One-time setup: add your Azure DevOps Personal Access Token (Marketplace >
# Manage scope) as a repository secret named VSCE_PAT.
# Settings > Secrets and variables > Actions > New repository secret.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # allows the job to create the GitHub Release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG. Bump the version, commit, then tag."
            exit 1
          fi

      - name: Type-check
        run: npm run compile

      - name: Package VSIX
        run: npm run package

      - name: Publish to VS Code Marketplace
        run: npx --yes @vscode/vsce publish --no-dependencies -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Create GitHub Release with the .vsix attached
        run: gh release create "$GITHUB_REF_NAME" ./*.vsix --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
